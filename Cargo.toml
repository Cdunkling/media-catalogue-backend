[package]
name = "media-catalogue-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7.1"
actix-web = "4"
bigdecimal = {version = "0.4.10", features = ["serde"] }
chrono = { version = "0.4.43", features = ["serde"] }
dotenv = "0.15.0"
env_logger = "0.11.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-async-std-native-tls", "postgres", "chrono", "uuid","bigdecimal"] }
uuid = { version = "1.20.0", features = ["serde", "v4"] }
yew-router = "0.19.0"
argon2 = "0.6.0"
password-hash = "0.6.1"
rand_core = "0.10.1"
